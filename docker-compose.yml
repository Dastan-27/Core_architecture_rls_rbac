services:
  postgres:
    image: postgres:16-alpine
    container_name: core_rls_rbac_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-core_rls_rbac}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-core_rls_rbac}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - core_network

  redis:
    image: redis:7-alpine
    container_name: core_rls_rbac_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - core_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  core_network:
    driver: bridge
